plugins {
    id 'com.android.application'
}

// In-app web updates (WebUpdater.java). The APK's bundled web files are versioned by the commit
// time of the build, the same number scripts/web-update.mjs stamps on published bundles, so a
// bundle only replaces the APK's files when it comes from a newer commit.
def builtInWebVersion = {
    try {
        def out = providers.exec {
            commandLine 'git', 'log', '-1', '--format=%ct'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        return out.isLong() ? out.toLong() : 0L
    } catch (Exception ignored) {
        return 0L
    }
}

// Public half of the update-signing key (created by `node scripts/web-update.mjs keygen`).
// Without it the updater stays off and the app just uses the files inside the APK.
def webUpdatePublicKeyHex = {
    def pem = rootProject.file('web-update-public.pem')
    if (!pem.exists()) return ''
    def b64 = pem.readLines().findAll { !it.startsWith('-----') }.join('').trim()
    return java.util.Base64.decoder.decode(b64).encodeHex().toString()
}

android {
    namespace 'app.lyricwave.twa'
    compileSdk 36

    defaultConfig {
        applicationId "app.lyricwave.twa"
        minSdk 21
        // Google Play requires targetSdk 36 for new apps and updates from Aug 31, 2026.
        targetSdk 36
        versionCode 5
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "long", "BUILT_IN_WEB_VERSION", "${builtInWebVersion()}L"
        buildConfigField "String", "WEB_UPDATE_PUBLIC_KEY", "\"${webUpdatePublicKeyHex()}\""
        manifestPlaceholders = [
            hostName: "lyricwave.pages.dev",
            defaultUrl: "https://lyricwave.pages.dev/?source=twa",
            launcherName: "LyricWave",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "app.lyricwave.twa", "sha256_cert_fingerprints": ["F3:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:01"]}}]'
        ]
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                def storeFilePath = project.property('RELEASE_STORE_FILE')
                def resolvedFile = file(storeFilePath).exists() ? file(storeFilePath) : rootProject.file(storeFilePath)
                storeFile resolvedFile
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.browser:browser:1.8.0'
}

// Production web files bundled into the app. Explicit allowlist so test files,
// Playwright config and dev tooling never ship inside the APK. Sync (not Copy)
// also removes stale files that are no longer in the list.
def webAppFiles = [
    'index.html', 'privacy.html', 'styles.css', 'manifest.webmanifest',
    'app.js', 'audio-reactive.js', 'auth.js', 'config.js', 'engine.js', 'lastfm.js', 'lyrics.js',
    'mic.js', 'phone-source.js', 'projectm-visualizer.js', 'reel.js', 'search.js', 'shazam-core.js',
    'spotify-source.js', 'translate.js', 'types.js', 'user-auth.js', 'visuals.js', 'card.js',
    'db.js', 'musicbrainz.js', 'library.js', 'library-view.js', 'openverse.js', 'user-lyrics.js', 'queue.js', 'playlists.js', 'backup.js',
    'kinetic.js'
]

task copyWebAssets(type: Sync) {
    from(rootDir.parentFile) {
        include webAppFiles
        include 'icons/**'
        include 'vendor/projectm/**'
    }
    into file("${projectDir}/src/main/assets")
}

preBuild.dependsOn copyWebAssets
